<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>My Portfolio</h1>
    <nav>
        <ul>
            <li><a href="index.html" class="active" onclick="transitionToPage(event, 'index.html')">Home</a></li>
            <li><a href="career.html" onclick="transitionToPage(event, 'career.html')">Career</a></li>
            <li><a href="digitalworks.html" onclick="transitionToPage(event, 'digitalworks.html')">Digital Creations</a></li>
            <li><a href="contact.html" onclick="transitionToPage(event, 'contact.html')">Contact</a></li>
        </ul>
    </nav>
</header>

<div class="main-content">
    <div class="content-container">
        <img src="virtualme.jpg" alt="Profile Image">
        <a href="contact.html" class="hire-me-btn">Hire Me</a>
        <p>"We are what we repeatedly do. Excellence, then, is not an act, but a habit" - Aristotle</p>
    </div>
</div>

<footer>
    <!-- The footer will remain unchanged -->
</footer>

<script>
    function transitionToPage(event, page) {
        event.preventDefault(); // Prevent default link behavior
        const mainContent = document.querySelector('.main-content');
        const navLinks = document.querySelectorAll('nav ul li a');

        // Start fade-out transition
        mainContent.classList.add('fade-out');

        // Remove active class from all links
        navLinks.forEach(link => {
            link.classList.remove('active');
        });

        // Add active class to the clicked link
        event.target.classList.add('active');

        // Wait for the fade-out transition to finish before navigating
        setTimeout(() => {
            window.location.href = page; // Navigate to the new page
        }, 500); // Duration should match the CSS transition
    }
</script>

</body>
</html>
